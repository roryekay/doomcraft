// Separate DoomCraft config, loaded only by the project launcher.
vid_preferbackend 0
vid_renderer 1
vid_fullscreen false
vid_defwidth 1280
vid_defheight 720
vid_setsize 1280 720
vid_vsync false
vid_maxfps 60
gl_multisample 0
gl_ssao 0
screenblocks 12
r_drawplayersprites false
crosshair 0
freelook true
movebob 0
stillbob 0
doomcraft_enabled true
bind f8 doomcraft_boss_menu
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
unbind e
bind g +use
bind space +jump
bind shift +speed
unbind f
unbind f3
unbind f4
unbind f9
unbind ctrl
unbind mouse1
unbind mouse2
bind mwheelup doomcraft_prev
bind mwheeldown doomcraft_next

bind f6 doomcraft_resupply

unbind f7
